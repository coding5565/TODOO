<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xodimlar nazorati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<script>try{var _t=localStorage.getItem('nz_theme');if(_t==='dark'||_t==='light')document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>
/* Layout: sticky top bar with tabs and save status; one centered working column; a card per employee */
:root{
  --bg:#f3f5f8;--surface:#ffffff;--ink:#17202e;--mute:#667186;--line:#dfe4ec;
  --accent:#1d5fa8;--accent-ink:#ffffff;--accent-soft:#e6eef9;
  --ok:#15803d;--ok-soft:#e3f4e8;--bad:#b91c1c;--bad-soft:#fbe7e7;--warn:#a15c07;--warn-soft:#fbf0dc;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131b;--surface:#161d28;--ink:#e7ebf2;--mute:#8e99ae;--line:#263042;
  --accent:#6aa6ec;--accent-ink:#0b1320;--accent-soft:#1a2a40;
  --ok:#4ade80;--ok-soft:#14301f;--bad:#f87171;--bad-soft:#381a1a;--warn:#e8a547;--warn-soft:#38290f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131b;--surface:#161d28;--ink:#e7ebf2;--mute:#8e99ae;--line:#263042;
  --accent:#6aa6ec;--accent-ink:#0b1320;--accent-soft:#1a2a40;
  --ok:#4ade80;--ok-soft:#14301f;--bad:#f87171;--bad-soft:#381a1a;--warn:#e8a547;--warn-soft:#38290f;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.tab{border:0;background:none;padding:7px 11px;border-radius:8px;color:var(--mute);font-weight:500}
.tab:hover{background:var(--accent-soft);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.st{font-size:12.5px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.st.ok{color:var(--ok);border-color:var(--ok)}.st.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
main{max-width:1000px;margin:0 auto;padding:18px 16px 56px;display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:15px;font-weight:600}
.card h3{margin:14px 0 8px;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 220px;min-width:0}
.lbl{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);font-weight:600}
.mute{color:var(--mute)}
.small{font-size:13px}

input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=checkbox]{padding:0;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--mute)}
.btn.ghost:hover{color:var(--ink);background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:default}

.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:end}
.formgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.days{display:flex;flex-wrap:wrap;gap:4px 10px}
.days label{display:flex;gap:4px;align-items:center;font-size:14px}

.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.group-h h2{margin:0}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}

.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task.first{border-top:0}
.task .chk{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ok);cursor:pointer;flex:none}
.task .body{flex:1;min-width:0}
.task .t{overflow-wrap:anywhere}
.task.done .t{color:var(--mute);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12.5px;color:var(--mute)}
.pill{padding:0 8px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.pill.rep{border-color:var(--accent);color:var(--accent)}
.late{color:var(--bad);font-weight:600}
.note{margin-top:4px;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.acts{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.task{flex-wrap:wrap}.acts{margin-left:34px;justify-content:flex-start;flex-basis:100%}}
.edit{display:grid;gap:8px;margin-top:8px;grid-template-columns:1fr 160px}
.edit .full{grid-column:1/-1}
@media (max-width:560px){.edit{grid-template-columns:1fr}}

/* ko'rsatkichlar */
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--bg)}
.kpi .kh{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;margin-bottom:8px}
.kgrid{display:grid;grid-template-columns:minmax(0,1.1fr) 240px minmax(0,1.4fr);gap:12px;align-items:start}
@media (max-width:700px){.kgrid{grid-template-columns:1fr}}
.kplan b{font-size:20px;letter-spacing:-.01em}
.kin{width:84px;font-size:17px;font-weight:600;text-align:right}
.kin[readonly]{background:transparent;border-color:transparent;padding-left:0}
.kfact{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kres{font-size:14px}
.kres .tag{display:inline-block;padding:1px 9px;border-radius:99px;font-weight:600;font-size:13px;margin-bottom:3px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.wait{background:var(--warn-soft);color:var(--warn)}.tag.idle{background:var(--accent-soft);color:var(--accent)}

.tablewrap{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
td.lt{color:var(--bad)}td.gd{color:var(--ok)}

.empty{text-align:center;padding:28px 12px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .row{justify-content:center;margin-top:12px}

textarea.big{width:100%;min-height:130px;font:12.5px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
.acct{display:flex;align-items:center;gap:4px;margin-left:auto}
#acct{display:flex;gap:2px}
.tab .s,.brand .s{display:none}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto}
.segb{flex:1 1 0;border:0;background:none;padding:9px 10px;border-radius:7px;color:var(--mute);font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center;justify-content:center}
.segb:hover{background:var(--accent-soft);color:var(--ink)}
.segb.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{background:var(--bad);color:var(--accent-ink);border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.kpi.old{border-color:var(--warn)}
.pill.warnp{border-color:var(--warn);color:var(--warn)}
.wn{color:var(--warn)}
.mstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:0 0 10px}
.mstrip>div{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mstrip b{font-size:20px;letter-spacing:-.01em}
.mstrip .lbl{font-size:11px}
@media (max-width:760px){
  .top-in{padding:8px 12px;gap:4px 10px;flex-wrap:nowrap}
  .brand{font-size:15px;white-space:nowrap}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;flex:none;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
  .tabs .tab{padding:9px 2px;text-align:center;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs .tab .f{display:none}.tabs .tab .s{display:inline}
  .acct .tab{padding:6px 8px;font-size:13px}
  .st{font-size:12px;padding:2px 8px}
  main{padding:12px 12px calc(88px + env(safe-area-inset-bottom,0px));gap:12px}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .card{padding:14px 12px}
  .group-h{flex-wrap:wrap;gap:2px 12px}
  .btn{padding:9px 14px}.btn.sm{padding:6px 11px}
  input,select,textarea{font-size:16px}
}
@media (max-width:520px){.brand .f{display:none}.brand .s{display:inline}}
@media (max-width:600px){
  .segb{padding:9px 6px;font-size:13px}
  .hm{display:none}
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
  table.rt td{border:0;padding:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0}
  table.rt td::before{content:attr(data-label);color:var(--mute);font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  table.rt td.sp2{grid-column:1/-1}
  table.rt td.nl::before{display:none}
  table.rt td.sp2 b{font-size:16px}
}
.kplan .small b{font-size:inherit}
@media (max-width:760px){
  .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kgrid{grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .kgrid .kres{grid-column:1/-1}
  .kgrid .field{align-items:flex-end}
  .kpi{padding:10px}
}
@media (max-width:600px){
  table.rt td.hm{display:none}
  table.rt td.ar{align-items:flex-end;text-align:right}
  .full.row>.btn{flex:1 1 40%}
  .mstrip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mstrip b{font-size:17px}
}
[hidden]{display:none!important}
</style>

<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="f">Xodimlar nazorati</span><span class="s">Nazorat</span></div>
  <nav class="tabs" id="tabs" aria-label="Bo'limlar"></nav>
  <div class="acct"><span class="st" id="st">Yuklanmoqda…</span><span id="acct"></span></div>
</div></header>
<main id="app"><section class="card empty"><b>Yuklanmoqda…</b>Ma'lumotlar o'qilyapti.</section></main>
<div id="toast" class="toast" hidden></div>

<script src="/vendor/jszip.min.js"></script>
<script>
/*CORE*/
const PER={day:'Kunlik',week:'Haftalik',month:'Oylik'};
const REP={day:'har kuni',week:'har hafta',month:'har oy'};
const MON=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
const DOW=['Yak','Du','Se','Chor','Pay','Ju','Sha'];
const DOW_ORDER=[1,2,3,4,5,6,0];

function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function today(){return dstr(new Date())}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return dstr(d)}
function fmt(s){if(!s)return'';const d=pd(s);return d.getDate()+'-'+MON[d.getMonth()]+', '+DOW[d.getDay()]}
function fmtD(s){if(!s)return'';const[y,m,d]=s.split('-');return d+'.'+m+'.'+y}
function fmtDW(s){return fmtD(s)+' '+DOW[pd(s).getDay()]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function r6(x){return Math.round(x*1e6)/1e6}
function fmtN(x){
  if(x==null||isNaN(x))return'—';
  const r=Math.round(x*100)/100;let[i,f]=Math.abs(r).toFixed(2).split('.');
  f=f.replace(/0+$/,'');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return(r<0?'−':'')+i+(f?','+f:'');
}
function fmtIn(x){return x==null?'':String(r6(x)).replace('.',',')}
function parseNum(s){
  s=String(s).trim().replace(/\s/g,'').replace(',','.');
  if(s==='')return{empty:true};
  const n=Number(s);
  return(isNaN(n)||n<0||!isFinite(n))?{bad:true}:{v:r6(n)};
}
function withUnit(m,v){return fmtN(v)+(m.unit?' '+m.unit:'')}

/* ---- ko'rsatkich hisobi: yetmagan qism ertangi rejaga qo'shiladi, ortiqchasi qolaveradi ---- */
function targetOn(m,d){let v=m.targets[0].v;for(const t of m.targets){if(t.from<=d)v=t.v}return v}
/* Haftalik (dushanbadan yakshanbagacha) yoki oylik reja uchun davr chegaralari */
function periodRange(m,d){
  if(m.kind==='week'){const dw=(pd(d).getDay()+6)%7,from=addDays(d,-dw);return{from,to:addDays(from,6)}}
  const[y,mo]=d.split('-').map(Number);
  return{from:dstr(new Date(y,mo-1,1)),to:dstr(new Date(y,mo,0))};
}
const isPeriodic=m=>m.kind==='week'||m.kind==='month';
const kindOf=m=>isPeriodic(m)?m.kind:'day';
const KIND_ORDER={day:0,week:1,month:2};
const KIND_NAME={day:'Kunlik',week:'Haftalik',month:'Oylik'};
const KIND_WORD={day:'kunlik me\'yor',week:'haftalik reja',month:'oylik reja'};
const NEXT_WORD={day:'ertaga',week:'keyingi haftaga',month:'keyingi oyga'};
const MONTHS_UZ=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
function planWord(m){return KIND_WORD[kindOf(m)]}
function nextWord(m){return NEXT_WORD[kindOf(m)]}
function planLabel(m,d){return (m.kind==='week'?'haftasiga ':m.kind==='month'?'oyiga ':'kuniga ')+withUnit(m,targetOn(m,d))}
function periodLabel(m,from){
  if(m.kind==='week')return fmtD(from).slice(0,5)+' – '+fmtD(addDays(from,6));
  const[y,mo]=from.split('-').map(Number);return MONTHS_UZ[mo-1]+' '+y;
}
/* haftalik/oylik davr ichidagi faktlar yig'indisi (kiritilmagan bo'lsa undefined) */
function periodTotal(m,vals,d){
  const r=periodRange(m,d);let has=false,t=0;
  for(const k in (vals||{}))if(k>=r.from&&k<=r.to){has=true;t+=vals[k]}
  return has?r6(t):undefined;
}
function getVal(m,vals,key){return isPeriodic(m)?periodTotal(m,vals,key):(vals||{})[key]}
function rowLabel(m,r){return isPeriodic(m)?periodLabel(m,r.date):fmtDW(r.date)}
/* haftalik/oylik: har davr uchun bitta qator; yetmagan qism keyingi davrga qo'shiladi */
function calcPeriods(m,vals,upto,t0){
  const rows=[];let carry=r6(Number(m.open)||0);vals=vals||{};
  const last=m.end&&m.end<upto?m.end:upto,keys=Object.keys(vals);
  let from=periodRange(m,m.start).from;
  for(let g=0;from<=last&&g<1500;g++){
    const r=periodRange(m,from),base=targetOn(m,r.from),plan=r6(base+carry);
    let done=0,has=false;for(const k of keys)if(k>=r.from&&k<=r.to){done+=vals[k];has=true}
    done=r6(done);
    const ended=r.to<t0,co=r6(Math.max(0,plan-done));
    rows.push({date:r.from,end:r.to,working:true,base,carryIn:r6(carry),plan,actual:has?done:null,done,
      missing:!has&&ended,pending:!has&&!ended,surplus:r6(Math.max(0,done-plan)),carryOut:co});
    carry=co;from=addDays(r.to,1);
  }
  return rows;
}
function calc(m,vals,upto,t0){
  if(isPeriodic(m))return calcPeriods(m,vals,upto,t0);
  const rows=[];let carry=r6(Number(m.open)||0);
  const end=m.end&&m.end<upto?m.end:upto;
  vals=vals||{};
  for(let d=m.start;d<=end;d=addDays(d,1)){
    const working=m.days.includes(pd(d).getDay()),has=vals[d]!==undefined;
    if(!working&&!has)continue;
    const base=working?targetOn(m,d):0,plan=r6(base+carry);
    const done=has?vals[d]:0;
    const co=r6(Math.max(0,plan-done));
    rows.push({date:d,working,base,carryIn:r6(carry),plan,actual:has?vals[d]:null,done,
      missing:!has&&d<t0,pending:!has&&d>=t0,surplus:r6(Math.max(0,done-plan)),carryOut:co});
    carry=co;
  }
  return rows;
}
/* keyingi reja: kunlik uchun keyingi ish kuni, haftalik/oylik uchun keyingi davr */
function nextPlan(m,vals,d,t0){
  if(isPeriodic(m)){
    const cur=periodRange(m,d),rows=calcPeriods(m,vals,cur.from,t0);
    const carry=rows.length?rows[rows.length-1].carryOut:r6(Number(m.open)||0);
    const ns=addDays(cur.to,1);
    if(m.end&&ns>m.end)return null;
    const base=targetOn(m,ns);
    return{date:ns,base,carry,plan:r6(base+carry),label:periodLabel(m,ns)};
  }
  const rows=calc(m,vals,d,t0);
  const carry=rows.length?rows[rows.length-1].carryOut:r6(Number(m.open)||0);
  for(let i=1;i<=14;i++){
    const n=addDays(d,i);
    if(m.end&&n>m.end)return null;
    if(m.days.includes(pd(n).getDay()))return{date:n,base:targetOn(m,n),carry,plan:r6(targetOn(m,n)+carry)};
  }
  return null;
}
/* d kuni (haftalik/oylik uchun d joylashgan davr) uchun to'liq ma'lumot */
function dayInfo(m,vals,d,t0){
  if(isPeriodic(m)){
    const r=periodRange(m,d);
    if(r.to<m.start)return{state:'before'};
    if(m.end&&r.from>m.end)return{state:'ended'};
    const row=calcPeriods(m,vals,r.from,t0).find(x=>x.date===r.from);
    return row?{state:'ok',row}:{state:'before'};
  }
  if(d<m.start)return{state:'before'};
  if(m.end&&d>m.end)return{state:'ended'};
  const rows=calc(m,vals,d,t0);
  const row=rows.find(r=>r.date===d);
  if(row)return{state:'ok',row};
  const prev=rows.length?rows[rows.length-1].carryOut:r6(Number(m.open)||0);
  return{state:'ok',row:{date:d,working:false,base:0,carryIn:prev,plan:prev,actual:null,done:0,missing:false,pending:d>=t0,surplus:0,carryOut:prev}};
}

/* davr statistikasi: me'yor yig'indisi, fakt yig'indisi, rejadan farq, qoldiq qarz */
function periodStat(m,vals,from,to,t0){
  const rows=calc(m,vals,to,t0).filter(r=>(r.end||r.date)>=from);
  const counted=rows.filter(r=>!r.pending);
  const sumBase=r6(counted.reduce((a,r)=>a+r.base,0)),sumDone=r6(counted.reduce((a,r)=>a+r.done,0));
  return{rows,sumBase,sumDone,gap:r6(sumDone-sumBase),
    pct:sumBase>0?Math.round(sumDone/sumBase*100):null,
    debt:counted.length?counted[counted.length-1].carryOut:(rows.length?rows[0].carryIn:0),
    missing:rows.filter(r=>r.missing).length};
}
function gapText(m,g){return g<0?'rejadan ortda: '+withUnit(m,-g):g>0?'rejadan oldinda: +'+withUnit(m,g):'reja bo\'yicha'}
/* ---- hisobot ---- */
function buildReport(S,from,to,t0){
  const emps=S.emps.map(e=>{
    const ms=S.metrics.filter(m=>m.emp===e.id).map(m=>Object.assign({m},periodStat(m,S.vals[m.id],from,to,t0))).filter(x=>x.rows.length)
      .sort((a,b)=>KIND_ORDER[kindOf(a.m)]-KIND_ORDER[kindOf(b.m)]);
    const ts=S.tasks.filter(t=>t.emp===e.id&&t.due>=from&&t.due<=to).sort((a,b)=>a.due.localeCompare(b.due));
    const tdone=ts.filter(t=>t.done).length;
    return{e,ms,ts,tdone,tpct:ts.length?Math.round(tdone/ts.length*100):null};
  }).filter(x=>x.ms.length||x.ts.length);
  return{from,to,emps,generated:t0};
}
function rowStatus(m,r){
  if(r.actual==null)return r.missing?'Kiritilmagan (0 hisoblandi)':'Kiritilmagan';
  if(r.actual>=r.plan)return r.surplus>0?'Bajarildi (+'+fmtN(r.surplus)+' ortiqcha)':'Bajarildi';
  return'Yetmadi: '+fmtN(r.plan-r.actual)+' '+nextWord(m)+' qo\'shiladi';
}
function taskStatus(t,t0){
  if(t.done)return'Bajarildi'+(t.doneAt?' ('+fmtD(t.doneAt)+')':'');
  return t.due<t0?'Bajarilmadi (kechikdi)':'Jarayonda';
}

const WNS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
const CW=10106; /* A4 da matn kengligi (twips) */
const WC={head:'1D5FA8',soft:'E6EEF9',sum:'F3F5F8',ink:'17202E',mute:'667186',line:'BFC6D2',
  ok:['E3F4E8','15803D'],bad:['FBE7E7','B91C1C'],warn:['FBF0DC','A15C07']};
function X(s){return String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function wRun(t,o={}){
  const rp=(o.b?'<w:b/>':'')+(o.i?'<w:i/>':'')+(o.color?'<w:color w:val="'+o.color+'"/>':'')+(o.sz?'<w:sz w:val="'+o.sz+'"/><w:szCs w:val="'+o.sz+'"/>':'');
  return'<w:r>'+(rp?'<w:rPr>'+rp+'</w:rPr>':'')+'<w:t xml:space="preserve">'+X(t)+'</w:t></w:r>';
}
/* text: satr yoki [{t,b,color,sz}] ro'yxati */
function wPara(text,o={}){
  const pp=(o.style?'<w:pStyle w:val="'+o.style+'"/>':'')+(o.keep?'<w:keepNext/>':'')+(o.pb?'<w:pageBreakBefore/>':'')
    +((o.before!=null||o.after!=null)?'<w:spacing'+(o.before!=null?' w:before="'+o.before+'"':'')+(o.after!=null?' w:after="'+o.after+'"':'')+'/>':'')
    +(o.jc?'<w:jc w:val="'+o.jc+'"/>':'');
  const runs=text===''||text==null?'':(Array.isArray(text)?text.map(x=>wRun(x.t,Object.assign({},o,x))).join(''):wRun(text,o));
  return'<w:p>'+(pp?'<w:pPr>'+pp+'</w:pPr>':'')+runs+'</w:p>';
}
function wCell(w,paras,o={}){
  return'<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'+(o.fill?'<w:shd w:val="clear" w:color="auto" w:fill="'+o.fill+'"/>':'')+(o.mid?'<w:vAlign w:val="center"/>':'')+'</w:tcPr>'+paras+'</w:tc>';
}
/* cols: ustun kengliklari; head: [{t,r}] yoki null; rows: [[{t,b,color,fill,r,c,sz,paras}]]; o: {keep,padV,padH,noBorder} */
function wTable(cols,head,rows,o={}){
  const total=cols.reduce((a,b)=>a+b,0),pv=o.padV??50,ph=o.padH??90;
  const bd=o.noBorder?'':'<w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(k=>'<w:'+k+' w:val="single" w:sz="4" w:space="0" w:color="'+WC.line+'"/>').join('')+'</w:tblBorders>';
  let x='<w:tbl><w:tblPr><w:tblW w:w="'+total+'" w:type="dxa"/>'+bd+'<w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="'+pv+'" w:type="dxa"/><w:left w:w="'+ph+'" w:type="dxa"/><w:bottom w:w="'+pv+'" w:type="dxa"/><w:right w:w="'+ph+'" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>'+cols.map(c=>'<w:gridCol w:w="'+c+'"/>').join('')+'</w:tblGrid>';
  const jc=(c,h)=>(c.r??(h&&h.r))?'right':(c.c?'center':null);
  if(head)x+='<w:tr><w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>'+head.map((h,i)=>wCell(cols[i],wPara(h.t,{b:true,sz:18,color:'FFFFFF',after:0,keep:o.keep,jc:jc(h,h)}),{fill:WC.head,mid:true})).join('')+'</w:tr>';
  rows.forEach((r,ri)=>{
    const last=ri===rows.length-1;
    x+='<w:tr><w:trPr><w:cantSplit/></w:trPr>'+r.map((c,i)=>wCell(cols[i],c.paras||wPara(c.t,{b:c.b,i:c.i,color:c.color,sz:c.sz||19,after:0,keep:o.keep&&!last,jc:jc(c,head&&head[i])}),{fill:c.fill,mid:true})).join('')+'</w:tr>';
  });
  return x+'</w:tbl>'+wPara('',{after:o.after??80});
}
const sgn=v=>v>0?'+'+fmtN(v):v<0?'−'+fmtN(-v):'0';
function pctStyle(p){return p==null?{t:'—',r:1,color:WC.mute}:p>=100?{t:p+'%',r:1,b:1,fill:WC.ok[0],color:WC.ok[1]}:p>=80?{t:p+'%',r:1,b:1,fill:WC.warn[0],color:WC.warn[1]}:{t:p+'%',r:1,b:1,fill:WC.bad[0],color:WC.bad[1]}}
function gapStyle(g){return{t:sgn(g),r:1,b:1,color:g<0?WC.bad[1]:g>0?WC.ok[1]:WC.mute}}
function rowState(r){
  if(r.actual==null)return r.missing?{t:'Kiritilmagan',fill:WC.warn[0],color:WC.warn[1]}:{t:'Kutilmoqda',color:WC.mute};
  return r.actual>=r.plan?{t:'Bajarildi',color:WC.ok[1]}:{t:'Yetmadi',fill:WC.bad[0],color:WC.bad[1]};
}

    const behind=[];withM.forEach(x=>x.ms.forEach(k=>{if(k.gap<0)behind.push({n:x.e.name,k})}));

      withT.map(x=>{const late=x.ts.filter(t=>!t.done&&t.due<rep.generated).length;
        return[{t:x.e.name,b:1},{t:String(x.ts.length),r:1},{t:String(x.tdone),r:1},{t:String(x.ts.length-x.tdone),r:1},
          {t:String(late),r:1,color:late?WC.bad[1]:WC.mute},pctStyle(x.tpct)]}),{keep:1});
  }
  b+=wPara('Hisoblash qoidasi: yetmagan qism keyingi kunga (haftalik ko\'rsatkichda keyingi haftaga, oylikda keyingi oyga) qo\'shiladi, ortiqcha qism keyingi rejani kamaytirmaydi. Fakt kiritilmagan o\'tgan davr 0 deb olinadi. "Rejadan farq" butun davr uchun jami fakt bilan jami me\'yor orasidagi ayirma.',{sz:17,color:WC.mute,i:1,before:120});

  /* har bir xodim alohida sahifada */
  rep.emps.forEach(x=>{
    b+=wPara(x.e.name,{style:'Heading1',pb:1});

      b+=wPara(k.m.name+(k.m.unit?' ('+k.m.unit+')':'')+'  ·  '+planWord(k.m)+': '+fmtN(targetOn(k.m,rep.to)),{style:'Heading2',keep:1});
      const card=(lab,val,color)=>({paras:wPara(lab,{sz:16,color:WC.mute,b:1,after:0,keep:1})+wPara(val,{sz:28,b:1,color:color||WC.ink,after:0,keep:1}),fill:WC.sum});

      b+=wTable([2300,900,1200,900,900,1000,2906],

          .concat([[{t:'Jami',b:1,fill:WC.sum},{t:fmtN(k.sumBase),b:1,fill:WC.sum,r:1},{t:'',fill:WC.sum},{t:'',fill:WC.sum},
            {t:fmtN(k.sumDone),b:1,fill:WC.sum,r:1},{t:sgn(k.gap),b:1,fill:WC.sum,r:1,color:k.gap<0?WC.bad[1]:k.gap>0?WC.ok[1]:WC.ink},

              fill:t.done?WC.ok[0]:late?WC.bad[0]:null,color:t.done?WC.ok[1]:late?WC.bad[1]:WC.mute},
            {t:t.note||'',i:1,color:WC.mute}]}));
    }
  });
  return pack(rep,b);
}

  if(col==='tasks'){const month=id.slice(0,7),emp=id.slice(8);
    const items=S.tasks.filter(t=>t.emp===emp&&(t.due||'').slice(0,7)===month);return items.length?{items}:null}
  if(col==='vals'){const k=id.lastIndexOf('_'),mid=id.slice(0,k),yr=id.slice(k+1),d={};
    Object.entries(S.vals[mid]||{}).forEach(([dt,v])=>{if(dt.slice(0,4)===yr)d[dt]=v});
    return Object.keys(d).length?{d}:null}
  return null;
}
function mark(...paths){
  paths.forEach(p=>dirty.add(p));
  clearTimeout(timer);timer=setTimeout(flush,500);setStatus('saving');
}
function markAll(){mark(...known,...allPaths())}
async function flush(){
  if(flushing)return;
  flushing=true;let path=null;
  try{
    while(dirty.size){
      path=dirty.values().next().value;
      const body=docBody(path),ref=DB.doc(path);
      if(body===null){if(known.has(path)){await ref.delete();known.delete(path)}}
      else{await ref.set(body);known.add(path)}
      dirty.delete(path);path=null;
    }
    setStatus('cloud');
  }catch(e){
    setStatus('err');clearTimeout(failTimer);failTimer=setTimeout(flush,8000);
  }finally{flushing=false}
}
window.addEventListener('beforeunload',e=>{if(dirty.size||flushing){e.preventDefault();e.returnValue=''}});

function serverDB(){
  const call=async(method,url,body)=>{
    const r=await fetch(url,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'nazorat'},body:body===undefined?undefined:JSON.stringify(body)});
    if(r.status===401){location.replace('/login');throw new Error('unauthorized')}
    return r;
  };
  const snap=(exists,data)=>({exists,data:()=>data});
  return{
    doc:path=>{const[col,id]=path.split('/');const u='/api/doc/'+col+'/'+encodeURIComponent(id);return{
      get:async()=>{const r=await call('GET',u);if(r.status===404)return snap(false);if(!r.ok)throw new Error('http '+r.status);return snap(true,await r.json())},
      set:async b=>{const r=await call('PUT',u,b);if(!r.ok)throw new Error('http '+r.status)},
      delete:async()=>{const r=await call('DELETE',u);if(!r.ok)throw new Error('http '+r.status)}}},
    collection:col=>({limit:()=>({get:async()=>{
      const r=await call('GET','/api/col/'+col);if(!r.ok)throw new Error('http '+r.status);
      const rows=await r.json();return{empty:!rows.length,docs:rows.map(x=>({id:x.id,data:()=>x.body}))}}})})
  };
}
async function apiPost(url,body){
  const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'nazorat'},body:JSON.stringify(body||{})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||'Xatolik ('+r.status+')');
  return j;
}
async function initCloud(){
  setStatus('load');
  DB=serverDB();
  const me=await fetch('/api/me',{credentials:'same-origin'});
  if(me.status===401){location.replace('/login');throw new Error('unauthorized')}
  ME=(await me.json()).username;
  const[meta,tc,vc]=await Promise.all([DB.doc(pMeta()).get(),DB.collection('tasks').limit(1000).get(),DB.collection('vals').limit(1000).get()]);
  const n=emptyS();
  if(meta.exists){const m=meta.data();n.emps=m.emps||[];n.rules=m.rules||[];n.metrics=m.metrics||[];known.add(pMeta())}
  tc.docs.forEach(d=>{(d.data().items||[]).forEach(t=>n.tasks.push(t));known.add('tasks/'+d.id)});
  vc.docs.forEach(d=>{const k=d.id.lastIndexOf('_'),mid=d.id.slice(0,k);n.vals[mid]=Object.assign(n.vals[mid]||{},d.data().d||{});known.add('vals/'+d.id)});
  S=n;cloud=true;setStatus('cloud');
}

/* takrorlanuvchi ishlar */
function ensure(){
  const t=today(),floor=addDays(t,-60);let ch=[];
  S.rules.forEach(r=>{
    const dates=[],skip=r.skip||[];
    if(r.rep==='day'){for(let d=r.start<floor?floor:r.start;d<=t;d=addDays(d,1))dates.push(d)}
    else if(r.rep==='week'){for(let d=r.start;d<=t;d=addDays(d,7))if(d>=floor)dates.push(d)}
    else{const s=pd(r.start);for(let k=0;k<600;k++){
      const dim=new Date(s.getFullYear(),s.getMonth()+k+1,0).getDate();
      const x=dstr(new Date(s.getFullYear(),s.getMonth()+k,Math.min(s.getDate(),dim)));
      if(x>t)break;if(x>=floor)dates.push(x)}}
    dates.forEach(d=>{
      if(skip.includes(d)||S.tasks.some(x=>x.rule===r.id&&x.due===d))return;
      const nt={id:uid(),emp:r.emp,title:r.title,per:r.rep,due:d,done:false,doneAt:'',note:'',rule:r.id};
      S.tasks.push(nt);ch.push(pTask(nt));
    });
  });
  if(ch.length)mark(...ch);
}

function kpiKey(m,d){return isPeriodic(m)?periodRange(m,d).from:d}
/* taxminiy natija uchun: shu davrdagi eski faktlar o'rniga pv qo'yiladi */
function valsWith(m,key,pv){
  const b=Object.assign({},S.vals[m.id]);
  if(isPeriodic(m)){const r=periodRange(m,key);for(const k in b)if(k>=r.from&&k<=r.to)delete b[k]}
  b[key]=pv;return b;
}
function kpiParts(m,d,pv){
  const t0=today(),per=isPeriodic(m),key=kpiKey(m,d);
  const vals=pv==null?S.vals[m.id]:valsWith(m,key,pv),info=dayInfo(m,vals,key,t0);
  if(info.state!=='ok')return{plan:`<span class="mute">${info.state==='before'?'Hali boshlanmagan':'Tugagan'}</span>`,res:'',off:true};

    +(!future?monthLine(m,key,t0):'');
  let res='';

  else{

    if(r.actual==null){
      res=r.missing?`<span class="tag bad">Kiritilmagan</span><div class="small mute">0 deb hisoblandi, qarz ${fmtN(r.carryOut)} ${per?'keyingi davrga':'ertaga'} o'tdi.</div>`
                   :`<span class="tag wait">Kiritilmagan</span><div class="small mute">${per?'Davr oxirida jami sonni yozing va "Tasdiqlash" ni bosing.':'Xodimdan so\'rab, faktni yozing va "Tasdiqlash" ni bosing.'}</div>`;
    }else if(r.actual>=r.plan){
      res=`<span class="tag ok">Bajarildi</span>${r.surplus>0?`<div class="small" style="color:var(--ok)">Ortiqcha: +${withUnit(m,r.surplus)} (qolaveradi)</div>`:''}`+npTxt;
    }else{
      res=`<span class="tag bad">Yetmadi: ${withUnit(m,r.plan-r.actual)}</span><div class="small">Bu qism keyingi rejaga qo'shiladi.</div>`+npTxt;

  return{plan:planHtml,res,off:future,actual:r.actual};
}
function monthFrom(m,d){const f=d.slice(0,8)+'01';return f<m.start?m.start:f}
/* kunlik: oy boshidan; haftalik/oylik: ko'rsatkich boshlanganidan hozirgi davrgacha */
function statFor(m,d,t0){
  return isPeriodic(m)?periodStat(m,S.vals[m.id],periodRange(m,m.start).from,periodRange(m,d).from,t0)
                      :periodStat(m,S.vals[m.id],monthFrom(m,d),d,t0);

function daysText(days){
  const s=[...days].sort((a,b)=>DOW_ORDER.indexOf(a)-DOW_ORDER.indexOf(b));
  if(s.length===7)return'har kuni';
  const idx=s.map(x=>DOW_ORDER.indexOf(x));
  if(idx.every((v,i)=>v===i)&&s.length>1)return DOW[s[0]]+'–'+DOW[s[s.length-1]];
  return s.map(x=>DOW[x]).join(', ');
}
function activeMetrics(emp,d,kind){
  return S.metrics.filter(m=>{
    if(m.emp!==emp||(kind&&kindOf(m)!==kind))return false;
    if(isPeriodic(m)){const r=periodRange(m,d);return r.to>=m.start&&(!m.end||r.from<=m.end)}
    return d>=m.start&&(!m.end||d<=m.end);
  });
}
/* haftalik/oylik: o'tgan, lekin kiritilmagan davrlar (oxirgi 4 ta) */
function missingPrev(m,d){
  if(!isPeriodic(m))return[];
  const cur=periodRange(m,d).from;
  return calcPeriods(m,S.vals[m.id],cur,today()).filter(r=>r.missing&&r.date<cur).slice(-4).map(r=>r.date);
}
/* shu ko'rsatkich uchun ko'rsatiladigan davr kalitlari: avval joriy, keyin kiritilmagan eskilari */
function subKeys(m,d){return isPeriodic(m)?[kpiKey(m,d),...missingPrev(m,d)]:[d]}
/* bo'limdagi "kiritilmagan" soni (belgi uchun) */
function subCount(kind,d){
  const t0=today();
  if(kind==='tasks')return S.tasks.filter(t=>(t.due===d||(d===t0&&isLate(t)))&&!t.done).length;
  if(d>t0)return 0;
  let n=0;
  S.emps.forEach(e=>activeMetrics(e.id,d,kind).forEach(m=>{
    const per=isPeriodic(m);
    subKeys(m,d).forEach((k,i)=>{
      if(getVal(m,S.vals[m.id],k)!==undefined)return;
      // joriy hafta/oy faqat oxirgi 2 kunida "kutilmoqda" deb sanaladi; eski davrlar doim
      if(per&&i===0&&d<addDays(periodRange(m,d).to,-1))return;
      n++;
    });
  }));
  return n;
}
const SUB_HINT={
  week:'Haftalik ko\'rsatkichga hafta oxirida bir marta, haftalik jami son kiritiladi. Kiritilmagan o\'tgan haftalar ham shu yerda ko\'rinadi.',

    +(SUB_HINT[sub]?`<p class="mute small" style="margin:0 2px">${SUB_HINT[sub]}</p>`:'');
  const cards=S.emps.map(e=>{

  }).join('');
  const empty=sub==='tasks'
    ?`<section class="card empty"><b>${isToday?'Bugun':'Bu sana'} uchun topshiriq yo'q</b>"+ Topshiriq" tugmasi bilan qo'shing yoki boshqa sanani tanlang.</section>`
    :`<section class="card empty"><b>${KIND_NAME[sub]} ko'rsatkich yo'q</b>"Ko'rsatkichlar" bo'limida ${sub==='day'?'kunlik me\'yor':sub==='week'?'haftalik reja':'oylik reja'} belgilang.
       <div class="row"><button class="btn pri" data-act="tab" data-v="kpi">Ko'rsatkichlar</button></div></section>`;
  $('#app').innerHTML=addForm()+bar+`
  <section class="card"><div class="row">
    <label class="lbl" for="d">Nazorat sanasi</label>
    <input type="date" id="d" value="${d}">

  +(sub==='tasks'?'':summaryCard(d,sub))

}

function sampleOffer(){
  if(S.emps.length||S.tasks.length)return'';
  return `<section class="card empty"><b>Hozircha hech narsa yo'q</b>Dastur qanday ishlashini ko'rish uchun namuna ma'lumot yuklashingiz mumkin. Keyin uni o'chirish oson.
    <div class="row"><button class="btn" data-act="sample">Namuna yuklash</button><button class="btn pri" data-act="tab" data-v="emps">Xodim qo'shish</button></div></section>`;
}

function dayChecks(sel,prefix){
  return `<div class="days">${DOW_ORDER.map(x=>`<label><input type="checkbox" class="${prefix}" value="${x}" ${sel.includes(x)?'checked':''}> ${DOW[x]}</label>`).join('')}</div>`;
}
function vKpi(){
  const t0=today();

  (!(ui.metricOpen||!S.metrics.length)?`<section class="card"><div class="row"><span class="grow mute small">Xodimlarga kunlik me'yor (reja) belgilang</span><button class="btn pri sm" data-act="metricopen">+ Ko'rsatkich</button></div></section>`:
  `<section class="card"><h2>Yangi kunlik ko'rsatkich</h2>
    <p class="mute small" style="margin:0 0 10px">Masalan: "Pul tushumi", birlik "mln", kuniga 7. Yoki "Visit", birlik "ta", kuniga 5. Kunlik fakt yetmasa, yetmagan qismi ertangi rejaga qo'shiladi. Ortiqcha qismi hisobdan chiqmaydi.</p>
    <div class="formgrid">
      <div class="field"><label class="lbl" for="m_emp">Xodim</label><select id="m_emp">${S.emps.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>

      <div class="field"><label class="lbl" for="m_unit">Birlik</label><input id="m_unit" placeholder="mln, ta, $" maxlength="12"></div>
      <div class="field"><label class="lbl" for="m_kind">Reja turi</label><select id="m_kind"><option value="day">Kunlik me'yor</option><option value="week">Haftalik reja (haftasiga jami)</option><option value="month">Oylik reja (oyiga jami)</option></select></div>
      <div class="field"><label class="lbl" id="m_tl" for="m_target">Kunlik me'yor</label><input id="m_target" inputmode="decimal" placeholder="7"></div>
      <div class="field"><label class="lbl" for="m_start">Boshlanish sanasi</label><input type="date" id="m_start" value="${t0}"></div>
      <div class="field"><label class="lbl" for="m_open">Boshlang'ich qarz (ixtiyoriy)</label><input id="m_open" inputmode="decimal" placeholder="0"></div>
      <div class="field full" id="m_days_wrap"><span class="lbl">Ish kunlari</span>${dayChecks([1,2,3,4,5,6],'mday')}</div>
      <p class="mute small full" id="m_hint" style="margin:0" hidden></p>
      <div class="full row"><button class="btn pri" data-act="addmetric">Qo'shish</button>${S.metrics.length?'<button class="btn" data-act="metricopen">Yopish</button>':''}</div>
    </div></section>`);
  const list=S.emps.map(e=>{
    const ms=S.metrics.filter(m=>m.emp===e.id);if(!ms.length)return'';
    const groups=['day','week','month'].map(k=>{const g=ms.filter(m=>kindOf(m)===k);
      return g.length?`<h3>${KIND_NAME[k]}</h3>`+g.map((m,i)=>metricRow(m,i===0,t0)).join(''):''}).join('');
    return `<section class="card"><h2>${esc(e.name)}</h2>${groups}</section>`;
  }).join('');
  $('#app').innerHTML=form+(list||(S.emps.length?`<section class="card empty"><b>Ko'rsatkichlar yo'q</b>Yuqoridan birinchisini qo'shing.</section>`:''))+sampleOffer();
}
function metricRow(m,first,t0){
  const cur=targetOn(m,t0),editing=ui.editM===m.id,ended=m.end&&m.end<t0;
  const rows=calc(m,S.vals[m.id],t0,t0).filter(r=>!r.pending);
  const debt=rows.length?rows[rows.length-1].carryOut:Number(m.open)||0;
  return `<div class="task ${first?'first':''}"><div class="body">
    <div class="t"><b>${esc(m.name)}</b> <span class="mute">· ${planLabel(m,t0)}${isPeriodic(m)?' · davr oxirida kiritiladi':' · '+daysText(m.days)}</span></div>
    <div class="meta"><span>${fmtD(m.start)} dan${m.end?' '+fmtD(m.end)+' gacha':''}</span>
      ${ended?'<span class="pill">tugagan</span>':''}
      <span class="${debt>0?'late':''} num">hozirgi qarz: ${withUnit(m,debt)}</span>
      ${m.targets.length>1?`<span>me'yor tarixi: ${m.targets.map(x=>fmtN(x.v)+' ('+fmtD(x.from)+')').join(' → ')}</span>`:''}</div>
    ${editing?`<div class="formgrid" style="margin-top:10px">
      <div class="field"><label class="lbl" for="x_name">Nomi</label><input id="x_name" value="${esc(m.name)}" maxlength="60"></div>
      <div class="field"><label class="lbl" for="x_unit">Birlik</label><input id="x_unit" value="${esc(m.unit)}" maxlength="12"></div>
      <div class="field"><label class="lbl" for="x_target">${m.kind==='week'?'Yangi haftalik reja':m.kind==='month'?'Yangi oylik reja':'Yangi kunlik me\'yor'}</label><input id="x_target" inputmode="decimal" value="${fmtIn(cur)}"></div>
      <div class="field"><label class="lbl" for="x_from">Qaysi sanadan</label><input type="date" id="x_from" value="${t0}"></div>
      ${isPeriodic(m)?'':`<div class="field full"><span class="lbl">Ish kunlari</span>${dayChecks(m.days,'xday')}</div>`}
      <div class="full row"><button class="btn pri sm" data-act="savemetric" data-id="${m.id}">Saqlash</button><button class="btn sm" data-act="cancelm">Bekor</button>
        <span class="mute small">Me'yor o'zgarsa, eski kunlar hisobi o'zgarmaydi.</span></div></div>`:''}
  </div><div class="acts">
    ${editing?'':`<button class="btn ghost sm" data-act="editm" data-id="${m.id}">Tahrir</button>`}
    ${ended?`<button class="btn ghost sm" data-act="resumem" data-id="${m.id}">Davom ettirish</button>`:`<button class="btn ghost sm" data-act="stopm" data-id="${m.id}">To'xtatish</button>`}
    ${ui.delMetric===m.id?`<button class="btn danger sm" data-act="delm2" data-id="${m.id}">Ha, kiritilgan natijalar bilan o'chirilsin</button><button class="btn sm" data-act="delno">Yo'q</button>`
      :`<button class="btn ghost sm" data-act="delm" data-id="${m.id}">O'chirish</button>`}
  </div></div>`;
}

function vTasks(){
  let l=S.tasks.filter(t=>(!ui.fEmp||t.emp===ui.fEmp)&&(!ui.fPer||t.per===ui.fPer)&&
    (!ui.fStat||(ui.fStat==='done'?t.done:ui.fStat==='late'?isLate(t):!t.done)));
  l.sort((a,b)=>a.done-b.done||(a.due||'9').localeCompare(b.due||'9'));
  const shown=l.slice(0,200);
  const rules=S.rules.map((r,i)=>`<div class="task ${i===0?'first':''}"><div class="body"><div class="t">${esc(r.title)}</div>
    <div class="meta"><span>${esc(empName(r.emp))}</span><span class="pill rep">${REP[r.rep]}</span><span class="num">${fmt(r.start)} dan</span></div></div>
    <div class="acts">${ui.delRule===r.id?`<button class="btn danger sm" data-act="rule2" data-id="${r.id}">Ha, to'xtatilsin</button><button class="btn sm" data-act="delno">Yo'q</button>`
      :`<button class="btn ghost sm" data-act="rule" data-id="${r.id}">To'xtatish</button>`}</div></div>`).join('');
  $('#app').innerHTML=addForm()+`
  <section class="card"><div class="row">
    <select id="f_emp" aria-label="Xodim"><option value="">Barcha xodimlar</option>${S.emps.map(e=>`<option value="${e.id}" ${ui.fEmp===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
    <select id="f_per" aria-label="Davr"><option value="">Barcha davrlar</option>${Object.entries(PER).map(([k,v])=>`<option value="${k}" ${ui.fPer===k?'selected':''}>${v}</option>`).join('')}</select>
    <select id="f_stat" aria-label="Holat"><option value="">Barcha holat</option><option value="open" ${ui.fStat==='open'?'selected':''}>Bajarilmagan</option><option value="done" ${ui.fStat==='done'?'selected':''}>Bajarilgan</option><option value="late" ${ui.fStat==='late'?'selected':''}>Kechikkan</option></select>
    <span class="mute num" style="margin-left:auto">${l.length} ta${l.length>200?' (200 tasi ko\'rsatilgan)':''}</span>${addBtn()}</div></section>
  <section class="card">${shown.length?shown.map((t,i)=>taskRow(t,true,i===0)).join(''):'<div class="empty"><b>Topshiriq topilmadi</b>Filtrlarni o\'zgartiring.</div>'}</section>
  ${rules?`<section class="card"><h2>Takrorlanuvchi ishlar</h2>${rules}</section>`:''}`+sampleOffer();
  bindForm();
  [['f_emp','fEmp'],['f_per','fPer'],['f_stat','fStat']].forEach(([id,k])=>$('#'+id).onchange=e=>{ui[k]=e.target.value;render()});
}

function vEmps(){
  $('#app').innerHTML=`<section class="card"><h2>Xodim qo'shish</h2><div class="row">
    <input id="e_name" class="grow" placeholder="Ism familiya" maxlength="80" aria-label="Ism familiya"><button class="btn pri" data-act="addemp">Qo'shish</button></div></section>
  <section class="card">${S.emps.length?S.emps.map((e,i)=>{
    const n=S.tasks.filter(t=>t.emp===e.id),open=n.filter(t=>!t.done).length,mk=S.metrics.filter(m=>m.emp===e.id).length;

}

function vReport(){
  const t0=today();
  if(ui.rt>t0)ui.rt=t0;if(ui.rf>ui.rt)ui.rf=ui.rt;
  const rep=buildReport(S,ui.rf,ui.rt,t0);
  const sections=rep.emps.map(x=>{
    const ms=x.ms.map(k=>{const pc=k.pct==null?'':(k.pct>=100?'gd':k.pct>=80?'wn':'lt');
      return `<h3>${esc(k.m.name)}${k.m.unit?', '+esc(k.m.unit):''} · ${planWord(k.m)} ${fmtN(targetOn(k.m,ui.rt))}</h3>
      <div class="mstrip"><div><span class="lbl">Me'yor</span><b class="num">${fmtN(k.sumBase)}</b></div><div><span class="lbl">Fakt</span><b class="num">${fmtN(k.sumDone)}</b></div>
        <div><span class="lbl">Bajarilish</span><b class="num ${pc}">${k.pct==null?'—':k.pct+'%'}</b></div>
        <div><span class="lbl">Rejadan farq</span><b class="num ${k.gap<0?'lt':k.gap>0?'gd':''}">${sgn(k.gap)}</b></div>
        <div><span class="lbl">Keyingiga qo'shiladi</span><b class="num ${k.debt>0?'lt':''}">${k.debt>0?fmtN(k.debt):'—'}</b></div></div>
      <div class="tablewrap"><table class="num"><thead><tr><th>${k.m.kind==='week'?'Hafta':k.m.kind==='month'?'Oy':'Sana'}</th><th class="r hm">Me'yor</th><th class="r hm">O'tgan qarz</th><th class="r">Reja</th><th class="r">Fakt</th><th class="r">Farq</th><th>Holat</th></tr></thead><tbody>
      ${k.rows.map(r=>{const st=rowState(r),cls=r.actual==null?(r.missing?'wn':''):(r.actual>=r.plan?'gd':'lt');
        return `<tr><td>${rowLabel(k.m,r)}</td><td class="r hm">${fmtN(r.base)}</td><td class="r hm">${r.carryIn?fmtN(r.carryIn):'—'}</td><td class="r">${fmtN(r.plan)}</td><td class="r"><b>${r.actual==null?'—':fmtN(r.actual)}</b></td><td class="r ${cls}">${r.actual==null?'—':sgn(r.actual-r.plan)}</td><td class="${cls}">${esc(st.t)}${r.actual!=null&&r.actual<r.plan?' ('+nextWord(k.m)+' +'+fmtN(r.plan-r.actual)+')':''}</td></tr>`}).join('')}
      <tr class="tot"><td>Jami</td><td class="r hm">${fmtN(k.sumBase)}</td><td class="hm"></td><td></td><td class="r">${fmtN(k.sumDone)}</td><td class="r ${k.gap<0?'lt':k.gap>0?'gd':''}">${sgn(k.gap)}</td><td>${k.pct==null?'—':k.pct+'% bajarildi'}</td></tr></tbody></table></div>
      ${k.missing?`<p class="small wn" style="margin:8px 0 0">Kiritilmagan ${isPeriodic(k.m)?'davrlar':'kunlar'}: ${k.missing} ta (0 deb hisoblangan)</p>`:''}`}).join('');
    const ts=x.ts.length?`<h3>Topshiriqlar: ${x.tdone} / ${x.ts.length} (${x.tpct}%)</h3><div class="tablewrap"><table><thead><tr><th>Muddat</th><th>Topshiriq</th><th>Holat</th><th>Izoh</th></tr></thead><tbody>
      ${x.ts.map(t=>`<tr><td class="num">${fmtDW(t.due)}</td><td>${esc(t.title)}</td><td class="${t.done?'gd':(t.due<t0?'lt':'')}">${esc(taskStatus(t,t0))}</td><td>${esc(t.note||'')}</td></tr>`).join('')}</tbody></table></div>`:'';
    return `<section class="card"><h2>${esc(x.e.name)}</h2>${ms}${ts}</section>`;
  }).join('');
  const overRows=rep.emps.flatMap(x=>x.ms.map(k=>{const pc=k.pct==null?'':(k.pct>=100?'gd':k.pct>=80?'wn':'lt');
    return `<tr><td class="sp2 nl" data-label="Xodim"><b>${esc(x.e.name)}</b></td><td class="nl" data-label="Ko'rsatkich">${esc(k.m.name)}${k.m.unit?' ('+esc(k.m.unit)+')':''} <span class="pill">${KIND_NAME[kindOf(k.m)]}</span></td><td class="r hm" data-label="Me'yor">${fmtN(k.sumBase)}</td><td class="r hm" data-label="Fakt">${fmtN(k.sumDone)}</td><td class="r nl ar ${pc}" data-label="Bajarilish"><b>${k.pct==null?'—':k.pct+'%'}</b></td><td class="r ${k.gap<0?'lt':k.gap>0?'gd':''}" data-label="Rejadan farq"><b>${sgn(k.gap)}</b></td><td class="r ${k.debt>0?'lt':''}" data-label="Keyingiga qo'shiladi">${k.debt>0?fmtN(k.debt):'—'}</td></tr>`})).join('');
  const overview=overRows?`<section class="card"><h2>Umumiy natija</h2><div class="tablewrap"><table class="num rt"><thead><tr><th>Xodim</th><th>Ko'rsatkich</th><th class="r hm">Me'yor</th><th class="r hm">Fakt</th><th class="r">Bajarilish</th><th class="r">Rejadan farq</th><th class="r">Keyingiga qo'shiladi</th></tr></thead><tbody>${overRows}</tbody></table></div></section>`:'';
  $('#app').innerHTML=`<section class="card"><div class="row">
      <div class="field"><label class="lbl" for="r_from">Qachondan</label><input type="date" id="r_from" value="${ui.rf}" max="${t0}"></div>
      <div class="field"><label class="lbl" for="r_to">Qachongacha</label><input type="date" id="r_to" value="${ui.rt}" max="${t0}"></div>
      <button class="btn sm" data-act="rpreset" data-v="week">Oxirgi 7 kun</button>
      <button class="btn sm" data-act="rpreset" data-v="month">Shu oy</button>
      <button class="btn sm" data-act="rpreset" data-v="prev">O'tgan oy</button>
      <button class="btn pri" data-act="docx" style="margin-left:auto" ${rep.emps.length?'':'disabled'}>Word (.docx) yuklab olish</button></div>
      <p class="mute small" style="margin:10px 0 0">Hisobot tanlangan davr bo'yicha, yuqorida ko'rinishi bilan Word faylga chiqadi.</p></section>`
    +overview+(sections||'<section class="card empty"><b>Bu davrda ma\'lumot yo\'q</b>Davrni o\'zgartiring.</section>');
  $('#r_from').onchange=e=>{ui.rf=e.target.value||ui.rf;render()};
  $('#r_to').onchange=e=>{ui.rt=e.target.value||ui.rt;render()};
}

/* ================= amallar ================= */
function bindForm(){
  const m=$('#a_emp');if(!m)return;
  m.onchange=e=>ui.addEmp=e.target.value;
  $('#a_per').onchange=e=>{ui.addPer=e.target.value;updHint()};
  $('#a_rep').onchange=e=>{ui.addRep=e.target.checked;updHint()};
  $('#a_due').onchange=e=>ui.addDue=e.target.value;
  $('#a_title').onkeydown=e=>{if(e.key==='Enter')addTask()};
}
function updHint(){const h=$('#a_hint');if(h)h.textContent=ui.addRep?"Shu muddatdan boshlab "+REP[ui.addPer]+" avtomatik paydo bo'ladi.":''}

function addTask(){
  const title=$('#a_title').value.trim();
  if(!title){$('#a_title').focus();return}
  const emp=$('#a_emp').value,per=$('#a_per').value,due=$('#a_due').value||today();
  let rule;
  if(ui.addRep){rule=uid();S.rules.push({id:rule,emp,title,rep:per,start:due,skip:[]})}
  const t={id:uid(),emp,title,per,due,done:false,doneAt:'',note:'',rule};
  S.tasks.push(t);
  ui.addEmp=emp;mark(pTask(t),pMeta());render();toast('Topshiriq qo\'shildi');
  const el=$('#a_title');if(el)el.focus();
}
function addEmp(){
  const n=$('#e_name').value.trim();if(!n)return;
  S.emps.push({id:uid(),name:n});mark(pMeta());render();toast('Xodim qo\'shildi');$('#e_name').focus();
}
function readDays(cls){return[...document.querySelectorAll('.'+cls+':checked')].map(x=>Number(x.value))}
function addMetric(){
  const name=$('#m_name').value.trim(),tg=parseNum($('#m_target').value),op=parseNum($('#m_open').value),days=readDays('mday'),start=$('#m_start').value||today();
  if(!name){toast('Nomini yozing');$('#m_name').focus();return}
  if(tg.empty||tg.bad||tg.v<=0){toast('Kunlik me\'yorni to\'g\'ri raqam bilan yozing');$('#m_target').focus();return}
  if(op.bad){toast('Boshlang\'ich qarz noto\'g\'ri');return}
  if(!days.length&&!['week','month'].includes($('#m_kind').value)){toast('Kamida bitta ish kunini belgilang');return}
  const kind=['week','month'].includes($('#m_kind').value)?$('#m_kind').value:undefined;
  if(kind)days.splice(0,days.length,0,1,2,3,4,5,6);
  S.metrics.push({id:uid(),emp:$('#m_emp').value,name,unit:$('#m_unit').value.trim(),kind,targets:[{from:start,v:tg.v}],days,start,end:'',open:op.v||0});
  ui.metricOpen=false;mark(pMeta());render();toast('Ko\'rsatkich qo\'shildi');
}
function saveMetric(id){
  const m=S.metrics.find(x=>x.id===id);if(!m)return;
  const name=$('#x_name').value.trim(),tg=parseNum($('#x_target').value),days=isPeriodic(m)?m.days:readDays('xday'),from=$('#x_from').value||today();
  if(!name||tg.empty||tg.bad||tg.v<=0||!days.length){toast('Nom, me\'yor va ish kunlarini tekshiring');return}
  m.name=name;m.unit=$('#x_unit').value.trim();m.days=days;
  const cur=targetOn(m,from),ex=m.targets.find(x=>x.from===from);
  if(ex)ex.v=tg.v;else if(tg.v!==cur)m.targets.push({from,v:tg.v});
  m.targets.sort((a,b)=>a.from.localeCompare(b.from));
  ui.editM=null;mark(pMeta());render();toast('Saqlandi');
}
function setVal(mid,date,raw){
  const m=S.metrics.find(x=>x.id===mid);if(!m)return;
  const p=parseNum(raw);
  if(p.bad){toast('Faqat musbat raqam yozing');return false}
  S.vals[mid]=S.vals[mid]||{};
  const marks=[pVal(mid,date)];
  if(isPeriodic(m)){ // davr uchun bitta jami son: eski kunlik yozuvlar bo'lsa, ular qo'shilib ketadi
    const r=periodRange(m,date);
    for(const k of Object.keys(S.vals[mid]))if(k>=r.from&&k<=r.to&&k!==date){delete S.vals[mid][k];marks.push(pVal(mid,k))}
  }
  if(p.empty)delete S.vals[mid][date];else S.vals[mid][date]=p.v;
  mark(...marks);
  return true;
}
function refreshKpi(mid,date,pv){
  const m=S.metrics.find(x=>x.id===mid),row=document.querySelector('[data-krow="'+mid+'_'+date+'"]');
  if(!m||!row)return;
  const p=kpiParts(m,date,pv);
  row.querySelector('[data-part="plan"]').innerHTML=p.plan;
  row.querySelector('[data-part="res"]').innerHTML=p.res;
}

function confirmK(btn){
  const mid=btn.dataset.mid,date=btn.dataset.date,row=btn.closest('[data-krow]'),inp=row.querySelector('.kin');
  if(inp.readOnly){inp.readOnly=false;inp.focus();inp.select();btn.textContent='Tasdiqlash';btn.classList.add('pri');return}
  const m=S.metrics.find(x=>x.id===mid),p=parseNum(inp.value),had=m&&getVal(m,S.vals[mid],date)!==undefined;
  if(p.bad){toast('Faqat musbat raqam yozing');inp.focus();return}
  if(p.empty&&!had){toast('Faktni yozing. Hech narsa bo\'lmasa 0 yozing');inp.focus();return}
  const ids=[...document.querySelectorAll('.kin')].map(i=>i.id),me=inp.id;
  setVal(mid,date,inp.value);
  render();toast(p.empty?'Fakt o\'chirildi':'Tasdiqlandi');
  for(let k=ids.indexOf(me)+1;k<ids.length;k++){const n=document.getElementById(ids[k]);if(n&&!n.readOnly&&!n.disabled){n.focus();break}}
}

function loadSample(){
  const a=uid(),b=uid(),c=uid(),t=today();
  S.emps.push({id:a,name:'Namuna: Dilshod A.'},{id:b,name:'Namuna: Madina K.'},{id:c,name:'Namuna: Jasur R.'});
  const add=(emp,title,per,due,done)=>S.tasks.push({id:uid(),emp,title,per,due,done:!!done,doneAt:done?due:'',note:'',rule:undefined});
  add(a,'Kassa hisobotini topshirish','day',t);add(a,'Mijozlar bazasini yangilash','week',addDays(t,2));add(a,'Oylik savdo tahlili','month',addDays(t,-1));
  add(b,'Ombor qoldig\'ini sanash','day',t,true);add(b,'Yangi mahsulot narxlarini kiritish','day',t);
  add(c,'Yetkazib berish jadvalini tekshirish','day',t);add(c,'Shartnomalarni tartiblash','week',addDays(t,-3));
  const start=addDays(t,-6),days=[1,2,3,4,5,6,0];
  const m1={id:uid(),emp:a,name:'Pul tushumi',unit:'mln',targets:[{from:start,v:7}],days,start,end:'',open:0};
  const m2={id:uid(),emp:a,name:'Visit',unit:'ta',targets:[{from:start,v:5}],days,start,end:'',open:0};
  const m3={id:uid(),emp:b,name:'Yangi to\'lovchi',unit:'ta',targets:[{from:start,v:3}],days,start,end:'',open:0};
  const w1={id:uid(),emp:b,name:'Yangi mijoz',unit:'ta',kind:'week',targets:[{from:addDays(t,-21),v:12}],days:[0,1,2,3,4,5,6],start:addDays(t,-21),end:'',open:0};
  const o1={id:uid(),emp:c,name:'Savdo hajmi',unit:'mln',kind:'month',targets:[{from:addDays(t,-70),v:150}],days:[0,1,2,3,4,5,6],start:addDays(t,-70),end:'',open:0};
  S.metrics.push(m1,m2,m3,w1,o1);
  S.vals[w1.id]={};[10,14,9].forEach((v,i)=>S.vals[w1.id][periodRange(w1,addDays(t,-21+7*i)).from]=v);
  S.vals[o1.id]={};[[-70,140],[-40,165]].forEach(([o,v])=>S.vals[o1.id][periodRange(o1,addDays(t,o)).from]=v);
  const f1=[6,8,7,5,9,6],f2=[3,7,5,5,4,6],f3=[2,4,3,3,1,3];
  [[m1,f1],[m2,f2],[m3,f3]].forEach(([m,f])=>{S.vals[m.id]={};f.forEach((v,i)=>S.vals[m.id][addDays(start,i)]=v)});
  markAll();render();toast('Namuna yuklandi');
}

async function saveFile(name,data){
  let dl=null;
  try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data});toast('Fayl saqlandi')}
    catch(e){toast(e&&e.code==='declined'?'Bekor qilindi':'Faylni saqlab bo\'lmadi'+(e&&e.message?': '+e.message:''))}
    return;
  }
  const url=URL.createObjectURL(new Blob([data]));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function exportDocx(){
  if(typeof JSZip==='undefined'){toast('Word modulini yuklab bo\'lmadi. Internetni tekshiring');return}
  const rep=buildReport(S,ui.rf,ui.rt,today());
  if(!rep.emps.length){toast('Bu davrda ma\'lumot yo\'q');return}
  const zip=new JSZip(),files=docxFiles(rep);
  Object.entries(files).forEach(([p,c])=>zip.file(p,c));
  const buf=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'});
  await saveFile('hisobot_'+ui.rf+'_'+ui.rt+'.docx',buf);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.type==='checkbox')return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  const reset=()=>{ui.del=ui.delEmp=ui.delRule=ui.delMetric=null;ui.impConfirm=false};
  switch(a){
    case'theme':cycleTheme();break;
    case'sub':ui.sub=v;render();break;
    case'tab':ui.tab=v;reset();ui.edit=null;ui.editM=null;ui.backup=false;ui.account=false;render();window.scrollTo(0,0);break;
    case'addopen':ui.addOpen=!ui.addOpen;render();if(ui.addOpen){const t=$('#a_title');if(t)t.focus()}break;
    case'add':addTask();break;
    case'addemp':addEmp();break;
    case'gotoday':ui.date=today();render();break;
    case'dayshift':ui.date=addDays(ui.date,Number(v));render();break;
    case'rpreset':{const t=today();
      if(v==='week'){ui.rf=addDays(t,-6);ui.rt=t}
      else if(v==='month'){ui.rf=t.slice(0,8)+'01';ui.rt=t}
      else{const d=pd(t.slice(0,8)+'01');d.setDate(0);ui.rt=dstr(d);ui.rf=ui.rt.slice(0,8)+'01'}
      render();break}
    case'docx':exportDocx();break;
    case'kconfirm':confirmK(el);break;
    case'sample':loadSample();break;
    case'addmetric':addMetric();break;
    case'metricopen':ui.metricOpen=!ui.metricOpen;render();if(ui.metricOpen){const t=$('#m_name');if(t)t.focus()}break;
    case'editm':reset();ui.editM=id;render();break;
    case'cancelm':ui.editM=null;render();break;
    case'savemetric':saveMetric(id);break;
    case'stopm':{const m=S.metrics.find(x=>x.id===id);if(m){m.end=today();mark(pMeta());render()}break}
    case'resumem':{const m=S.metrics.find(x=>x.id===id);if(m){m.end='';mark(pMeta());render()}break}
    case'delm':reset();ui.delMetric=id;render();break;
    case'delm2':{
      const paths=Object.keys(S.vals[id]||{}).map(d=>pVal(id,d));
      S.metrics=S.metrics.filter(x=>x.id!==id);delete S.vals[id];ui.delMetric=null;
      mark(pMeta(),...paths);render();toast('O\'chirildi');break}
    case'edit':reset();ui.edit=id;render();break;
    case'canceledit':ui.edit=null;render();break;
    case'saveedit':{const t=S.tasks.find(x=>x.id===id);const title=$('#e_title').value.trim();
      if(t&&title){const old=pTask(t);t.title=title;t.note=$('#e_note').value.trim();t.due=$('#e_due').value||t.due;if(t.done&&!t.doneAt)t.doneAt=today();mark(old,pTask(t))}
      ui.edit=null;render();break}
    case'del':reset();ui.del=id;render();break;
    case'del2':{const t=S.tasks.find(x=>x.id===id);
      if(t){let extra=[];
        if(t.rule){const r=S.rules.find(x=>x.id===t.rule);if(r){(r.skip=r.skip||[]).push(t.due);extra=[pMeta()]}}
        S.tasks=S.tasks.filter(x=>x.id!==id);mark(pTask(t),...extra)}
      ui.del=null;render();toast('O\'chirildi');break}
    case'delno':reset();render();break;
    case'rule':reset();ui.delRule=id;render();break;
    case'rule2':S.rules=S.rules.filter(x=>x.id!==id);ui.delRule=null;mark(pMeta());render();toast('Takrorlanish to\'xtatildi');break;
    case'emp':reset();ui.delEmp=id;render();break;
    case'emp2':{
      const paths=S.tasks.filter(t=>t.emp===id).map(pTask);
      S.metrics.filter(m=>m.emp===id).forEach(m=>{Object.keys(S.vals[m.id]||{}).forEach(d=>paths.push(pVal(m.id,d)));delete S.vals[m.id]});
      S.emps=S.emps.filter(x=>x.id!==id);S.tasks=S.tasks.filter(t=>t.emp!==id);S.rules=S.rules.filter(x=>x.emp!==id);S.metrics=S.metrics.filter(m=>m.emp!==id);
      ui.delEmp=null;mark(pMeta(),...paths);render();toast('Xodim o\'chirildi');break}
    case'backup':ui.backup=!ui.backup;ui.account=false;ui.impConfirm=false;render();break;
    case'account':ui.account=!ui.account;ui.backup=false;render();break;
    case'chpass':{
      const o=$('#pw_old').value,n=$('#pw_new').value,n2=$('#pw_new2').value;
      if(n.length<8){toast('Yangi parol kamida 8 belgi bo\'lsin');break}
      if(n!==n2){toast('Yangi parollar bir xil emas');break}
      apiPost('/api/password',{old:o,next:n}).then(()=>{ui.account=false;render();toast('Parol o\'zgartirildi')}).catch(e=>toast(e.message));break}
    case'logout':apiPost('/api/logout').finally(()=>location.replace('/login'));break;
    case'bkfile':saveFile('nazorat-zaxira-'+today()+'.json',JSON.stringify(S,null,1));break;
    case'copy':{const ta=$('#bk_out');
      const fb=()=>{ta.select();toast('Matn belgilandi, Ctrl+C bosing')};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(()=>toast('Nusxalandi'),fb);else fb();break}
    case'imp':{const txt=$('#bk_in').value.trim();
      try{const j=JSON.parse(txt);if(!j.emps||!j.tasks)throw 0;ui.impConfirm=true;ui.impText=txt;render()}
      catch(x){toast('Matn noto\'g\'ri. To\'liq zaxira matnini joylang')}break}
    case'imp2':{try{const j=JSON.parse(ui.impText);S=norm(j);ui.impConfirm=false;ui.impText='';ui.backup=false;markAll();render();toast('Tiklandi')}catch(x){toast('Xatolik')}break}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='done'){
    const t=S.tasks.find(x=>x.id===el.dataset.id);if(!t)return;
    t.done=el.checked;t.doneAt=t.done?today():'';mark(pTask(t));render();return;
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(!el.classList||!el.classList.contains('kin')||el.readOnly)return;
  const p=parseNum(el.value);
  refreshKpi(el.dataset.mid,el.dataset.date,p.v);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('kin')&&!e.target.readOnly){e.preventDefault();const b=e.target.closest('[data-krow]').querySelector('[data-act="kconfirm"]');if(b)confirmK(b)}
  if(e.key==='Enter'&&e.target.id==='m_target')addMetric();
});
document.addEventListener('change',e=>{
  if(e.target.id==='m_kind'){
    const v=e.target.value;

    const per=v==='week'||v==='month',h=$('#m_hint');
    $('#m_days_wrap').hidden=per;
    h.hidden=!per;
    h.textContent=per?'Bu ko\'rsatkich '+(v==='week'?'hafta':'oy')+' oxirida bir marta, '+(v==='week'?'haftalik':'oylik')+' jami son bilan kiritiladi. Yetmagan qism keyingi '+(v==='week'?'haftaga':'oyga')+' qo\'shiladi.':'';
  }
  if(e.target.id==='d'){ui.date=e.target.value||today();render()}
});

(async()=>{
  try{await initCloud();ready=true;render()}
