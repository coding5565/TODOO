<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kirish — Xodimlar nazorati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<script>try{var _t=localStorage.getItem('nz_theme');if(_t==='dark'||_t==='light')document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>
:root{
  --bg:#f5f6f9;--surface:#ffffff;--ink:#1b2330;--mute:#677285;--line:#e5e8ee;
  --accent:#2457c5;--accent-ink:#ffffff;--accent-soft:#eaf0fc;--bad:#c0392b;--bad-soft:#fbe9e7;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b;--surface:#171d26;--ink:#e9edf3;--mute:#93a0b4;--line:#28313e;
  --accent:#7aa7f2;--accent-ink:#0c1524;--accent-soft:#1b2a45;--bad:#f08080;--bad-soft:#3a1c1c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b;--surface:#171d26;--ink:#e9edf3;--mute:#93a0b4;--line:#28313e;
  --accent:#7aa7f2;--accent-ink:#0c1524;--accent-soft:#1b2a45;--bad:#f08080;--bad-soft:#3a1c1c;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);display:grid;place-items:center;padding:20px 16px}
.box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 26px}
h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--mute);font-size:15px}
form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute);font-weight:500}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 14px;height:48px;min-width:0;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.main{font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;height:48px;margin-top:4px}
button.main:disabled{opacity:.6;cursor:default}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:500;cursor:pointer;padding:8px 0 0;text-align:center}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="box">
  <h1 id="h">Xodimlar nazorati</h1>
  <p id="sub">Yuklanmoqda…</p>
  <form id="f" hidden autocomplete="on">
    <label id="codeRow" hidden>Maxfiy kod<input id="code" autocomplete="off" spellcheck="false"></label>
    <label>Login<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Parol<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <label id="p2Row" hidden>Parolni takrorlang<input id="p2" type="password" autocomplete="new-password"></label>
    <div id="err" class="err" role="alert" hidden></div>
    <button id="btn" class="main" type="submit">Kirish</button>
    <button id="toggle" class="link" type="button" hidden>Super admin sifatida ro'yxatdan o'tish</button>
  </form>
</main>
<script>
const $=s=>document.querySelector(s);
let reg=false,canRegister=false,hasUsers=true;
function showErr(m){const e=$('#err');e.textContent=m;e.hidden=!m}
async function post(url,body){
  const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'nazorat'},body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||'Xatolik ('+r.status+')');
  return j;
}
function mode(r){
  reg=r;showErr('');
  $('#h').textContent=r?'Super admin akkaunti':'Xodimlar nazorati';
  $('#sub').textContent=r?'Maxfiy kodni kiriting va o\'zingizga login hamda parol tanlang. Bu akkaunt xodimlar yaratadi va ularni boshqaradi.':'Davom etish uchun login va parolingizni kiriting.';
  $('#codeRow').hidden=!r;$('#p2Row').hidden=!r;
  $('#p').autocomplete=r?'new-password':'current-password';
  $('#btn').textContent=r?'Akkaunt ochish':'Kirish';
  const t=$('#toggle');t.hidden=!canRegister||!hasUsers;t.textContent=r?'Akkauntim bor, kirish':'Super admin sifatida ro\'yxatdan o\'tish';
  (r?$('#code'):$('#u')).focus();
}
(async()=>{
  try{
    const s=await (await fetch('/api/status',{credentials:'same-origin'})).json();
    if(s.loggedIn){location.replace('/');return}
    canRegister=s.canRegister;hasUsers=s.hasUsers;
    $('#f').hidden=false;
    mode(!s.hasUsers);
  }catch(e){$('#sub').textContent='Serverga ulanib bo\'lmadi. Sahifani yangilang.'}
})();
$('#toggle').addEventListener('click',()=>mode(!reg));
$('#f').addEventListener('submit',async ev=>{
  ev.preventDefault();showErr('');
  const username=$('#u').value.trim(),password=$('#p').value;
  if(reg&&password!==$('#p2').value){showErr('Ikkala parol bir xil emas');return}
  if(reg&&password.length<8){showErr('Parol kamida 8 belgi bo\'lsin');return}
  $('#btn').disabled=true;
  try{
    await post(reg?'/api/register-admin':'/api/login',reg?{code:$('#code').value.trim(),username,password}:{username,password});
    location.replace('/');
  }catch(e){showErr(e.message);$('#btn').disabled=false}
});
</script>
</body>
</html>
